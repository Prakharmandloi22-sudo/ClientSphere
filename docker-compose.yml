version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clientsphere-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clientsphere_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clientsphere_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-clientsphere_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/db/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientsphere_user -d clientsphere_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clientsphere-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: ../docker/Dockerfile.server
    container_name: clientsphere-server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-clientsphere_user}:${POSTGRES_PASSWORD:-clientsphere_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-clientsphere_db}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-clientsphere-super-secret-jwt-key-2026}
      REFRESH_SECRET: ${REFRESH_SECRET:-clientsphere-refresh-secret-key-2026}
      PYTHON_ANALYTICS_URL: http://analytics:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"

  analytics:
    build:
      context: ./services/analytics
      dockerfile: ../../docker/Dockerfile.analytics
    container_name: clientsphere-analytics
    restart: always
    environment:
      PORT: 8000
    ports:
      - "8000:8000"

  client:
    build:
      context: ./client
      dockerfile: ../docker/Dockerfile.client
    container_name: clientsphere-client
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000
    depends_on:
      - server
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: clientsphere-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server
      - analytics

volumes:
  pgdata:
  redisdata:
